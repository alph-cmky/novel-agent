version: "3.8"

services:
  web:
    build: .
    container_name: novel-agent-web
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - BUDGET_MODEL=${BUDGET_MODEL:-deepseek-chat}
      - QUALITY_MODEL=${QUALITY_MODEL:-deepseek-chat}
      - NOVEL_DATA_DIR=/app/novel-data
    volumes:
      - ./novel-data:/app/novel-data

  # CLI mode — interactive use (stdin/tty required)
  cli:
    build: .
    container_name: novel-agent-cli
    profiles: ["cli"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - BUDGET_MODEL=${BUDGET_MODEL:-deepseek-chat}
      - QUALITY_MODEL=${QUALITY_MODEL:-deepseek-chat}
    volumes:
      - ./novel-data:/app/novel-data
    stdin_open: true
    tty: true
    entrypoint: ["uv", "run", "novel-agent"]
